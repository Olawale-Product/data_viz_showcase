name: Agent Reach Sandbox

on:
  push:
    branches:
      - agent-reach-sandbox
    paths-ignore:
      - agent_reach_output.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  agent-reach-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent-reach-sandbox

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install and run Agent Reach
        shell: bash
        run: |
          set +e
          {
            echo '=== INSTALL AGENT REACH ==='
            python -m pip install --upgrade pip
            pip install 'git+https://github.com/Panniantong/Agent-Reach.git'
            echo
            echo '=== INSTALL TWITTER CLI ==='
            pip install twitter-cli
            echo
            echo '=== VERSION ==='
            agent-reach --version || true
            echo
            echo '=== DOCTOR AFTER TWITTER CLI INSTALL ==='
            agent-reach doctor --json || true
            echo
            echo '=== COMMANDS ==='
            command -v agent-reach || true
            command -v twitter || true
            twitter --help 2>/dev/null | head -80 || true
            echo
            echo '=== ACCESSCORP SEARCH ==='
            twitter search 'ACCESSCORP OR "Access Holdings" OR "Access Bank"' -n 20 || true
            echo '=== END SEARCH ==='
          } 2>&1 | tee agent_reach_output.txt

      - name: Commit sandbox output
        shell: bash
        run: |
          git config user.name 'agent-reach-sandbox'
          git config user.email 'actions@users.noreply.github.com'
          git add agent_reach_output.txt
          git commit -m 'Save Agent Reach sandbox output [skip ci]' || exit 0
          git push origin HEAD:agent-reach-sandbox
