name: Agent Reach Sandbox

on:
  push:
    branches:
      - agent-reach-sandbox
    paths-ignore:
      - agent_reach_output.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  agent-reach-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
      TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
      AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
      CT0: ${{ secrets.TWITTER_CT0 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent-reach-sandbox

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and test Agent Reach Twitter backends
        shell: bash
        run: |
          set +e
          {
            echo '=== INSTALL AGENT REACH ==='
            python -m pip install --upgrade pip >/dev/null
            pip install 'git+https://github.com/Panniantong/Agent-Reach.git' >/dev/null
            echo '=== INSTALL BIRD ==='
            npm install -g @steipete/bird >/dev/null
            echo '=== AUTH CHECK ==='
            if [ -n "$TWITTER_AUTH_TOKEN" ] && [ -n "$TWITTER_CT0" ]; then echo 'Twitter secrets detected.'; else echo 'Twitter secrets missing.'; fi
            echo '=== BIRD WHOAMI ==='
            bird whoami --plain || true
            echo '=== FINANCE SEARCH 1: ACCESSCORP ==='
            bird search 'ACCESSCORP' -n 50 --json || true
            echo '=== FINANCE SEARCH 2: ACCESS HOLDINGS ==='
            bird search '"Access Holdings" (NGX OR stock OR shares OR valuation OR dividend OR investor)' -n 50 --json || true
            echo '=== FINANCE SEARCH 3: ACCESSCORP NGX ==='
            bird search 'ACCESSCORP (NGX OR stock OR shares OR valuation OR dividend OR earnings)' -n 50 --json || true
            echo '=== END SEARCHES ==='
            echo '=== AGENT REACH DOCTOR ==='
            agent-reach doctor --json || true
          } 2>&1 | tee agent_reach_output.txt

      - name: Commit sandbox output
        shell: bash
        run: |
          git config user.name 'agent-reach-sandbox'
          git config user.email 'actions@users.noreply.github.com'
          git add agent_reach_output.txt
          git commit -m 'Save targeted Access Holdings X search [skip ci]' || exit 0
          git push origin HEAD:agent-reach-sandbox
