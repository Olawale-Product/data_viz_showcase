name: Agent Reach Sandbox

on:
  push:
    branches:
      - agent-reach-sandbox
    paths-ignore:
      - agent_reach_output.txt
      - youtube_transcript_output.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  agent-reach-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
      TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
      AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
      CT0: ${{ secrets.TWITTER_CT0 }}
      NGXPULSE_API_KEY: ${{ secrets.NGXPULSE_API_KEY }}
      YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent-reach-sandbox

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test authenticated YouTube transcript
        shell: bash
        run: |
          set +e
          {
            echo '=== INSTALL YT-DLP ==='
            python -m pip install --upgrade yt-dlp >/dev/null
            echo '=== YOUTUBE SECRET CHECK ==='
            if [ -n "$YOUTUBE_COOKIES" ]; then echo 'YouTube cookies secret detected.'; else echo 'YouTube cookies secret missing.'; fi
            printf '%s' "$YOUTUBE_COOKIES" > /tmp/youtube_cookies.txt
            chmod 600 /tmp/youtube_cookies.txt
            echo '=== VIDEO INFO ==='
            yt-dlp --cookies /tmp/youtube_cookies.txt --skip-download --print '%(title)s | %(channel)s | %(duration_string)s' 'https://youtu.be/4GgINqj-7DU' || true
            echo '=== SUBTITLE LIST ==='
            yt-dlp --cookies /tmp/youtube_cookies.txt --list-subs 'https://youtu.be/4GgINqj-7DU' || true
            echo '=== DOWNLOAD ENGLISH SUBTITLES ==='
            rm -f /tmp/ytsub.*
            yt-dlp --cookies /tmp/youtube_cookies.txt --skip-download --write-subs --write-auto-subs --sub-langs 'en.*' --sub-format vtt -o '/tmp/ytsub.%(ext)s' 'https://youtu.be/4GgINqj-7DU' || true
            echo '=== TRANSCRIPT FILES ==='
            ls -la /tmp/ytsub* 2>/dev/null || true
            for f in /tmp/ytsub*.vtt; do
              [ -e "$f" ] || continue
              echo "--- $f ---"
              python - "$f" <<'PY'
import re, sys
p=sys.argv[1]
text=open(p,encoding='utf-8',errors='ignore').read().splitlines()
out=[]
for line in text:
    if not line or line.startswith('WEBVTT') or '-->' in line or line.startswith('Kind:') or line.startswith('Language:'):
        continue
    line=re.sub(r'<[^>]+>','',line)
    line=re.sub(r'&nbsp;',' ',line)
    line=re.sub(r'&amp;','&',line)
    if line and (not out or line != out[-1]):
        out.append(line)
print('\n'.join(out))
PY
            done
            rm -f /tmp/youtube_cookies.txt
          } 2>&1 | tee youtube_transcript_output.txt

      - name: Commit transcript output
        shell: bash
        run: |
          git config user.name 'agent-reach-sandbox'
          git config user.email 'actions@users.noreply.github.com'
          git add youtube_transcript_output.txt
          git commit -m 'Save authenticated YouTube transcript test [skip ci]' || exit 0
          git push origin HEAD:agent-reach-sandbox
