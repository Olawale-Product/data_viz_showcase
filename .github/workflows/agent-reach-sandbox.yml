name: Agent Reach Sandbox

on:
  push:
    branches:
      - agent-reach-sandbox
    paths-ignore:
      - agent_reach_output.txt
      - youtube_transcript_output.txt
      - jse_social_output.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  agent-reach-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
      TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
      AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
      CT0: ${{ secrets.TWITTER_CT0 }}
      NGXPULSE_API_KEY: ${{ secrets.NGXPULSE_API_KEY }}
      YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
      MANSA_API_KEY: ${{ secrets.MANSA_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent-reach-sandbox

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Search South African JSE discussion on X
        shell: bash
        run: |
          set +e
          {
            npm install -g @steipete/bird >/dev/null
            echo '=== QUERY 1: JOHANNESBURG ==='
            bird search '("Johannesburg Stock Exchange" OR "JSE Top 40" OR "JSE All Share") (stocks OR shares OR investing OR investor OR trader)' -n 60 --json || true
            echo '=== QUERY 2: MAJOR SA TICKERS ==='
            bird search '(Naspers OR Prosus OR Capitec OR Sasol OR Shoprite OR "Standard Bank" OR MTN) (JSE OR "South Africa" OR shares)' -n 60 --json || true
            echo '=== QUERY 3: SOUTH AFRICAN STOCKS ==='
            bird search '("South African stocks" OR "SA stocks" OR "JSE shares") (investing OR trader OR portfolio)' -n 60 --json || true
            echo '=== QUERY 4: EASYEQUITIES / SATRIX ==='
            bird search '(EasyEquities OR Satrix) (JSE OR "South African shares" OR stocks)' -n 60 --json || true
          } 2>&1 | tee jse_social_output.txt

      - name: Commit JSE social output
        shell: bash
        run: |
          git config user.name 'agent-reach-sandbox'
          git config user.email 'actions@users.noreply.github.com'
          git add jse_social_output.txt
          git commit -m 'Save refined JSE social search output [skip ci]' || exit 0
          git push origin HEAD:agent-reach-sandbox
