name: Agent Reach Sandbox

on:
  push:
    branches:
      - agent-reach-sandbox
    paths-ignore:
      - agent_reach_output.txt
      - youtube_transcript_output.txt
      - jse_social_output.txt
      - requested_tweet_output.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  agent-reach-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
      TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
      AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
      CT0: ${{ secrets.TWITTER_CT0 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent-reach-sandbox

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read requested X thread
        shell: bash
        run: |
          set +e
          {
            npm install -g @steipete/bird >/dev/null
            echo '=== REQUESTED TWEET ==='
            bird read 'https://x.com/moyo54/status/2089959042282086710' --json || true
            echo '=== THREAD ==='
            bird thread 'https://x.com/moyo54/status/2089959042282086710' --json || true
            echo '=== REPLIES ==='
            bird replies 'https://x.com/moyo54/status/2089959042282086710' --json || true
          } 2>&1 | tee requested_tweet_output.txt

      - name: Commit requested tweet output
        shell: bash
        run: |
          git config user.name 'agent-reach-sandbox'
          git config user.email 'actions@users.noreply.github.com'
          git add requested_tweet_output.txt
          git commit -m 'Save requested X thread output [skip ci]' || exit 0
          git push origin HEAD:agent-reach-sandbox
