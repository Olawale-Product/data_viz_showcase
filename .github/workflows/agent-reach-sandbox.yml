name: Agent Reach Sandbox

on:
  push:
    branches:
      - agent-reach-sandbox
  workflow_dispatch:

jobs:
  agent-reach-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Agent Reach
        run: |
          python -m pip install --upgrade pip
          pip install 'git+https://github.com/Panniantong/Agent-Reach.git'

      - name: Agent Reach version and doctor
        run: |
          echo '=== VERSION ==='
          agent-reach --version || true
          echo '=== DOCTOR ==='
          agent-reach doctor --json || true

      - name: Inspect available Twitter backend
        run: |
          echo '=== COMMANDS ==='
          command -v agent-reach || true
          command -v twitter || true
          twitter --help 2>/dev/null | head -80 || true

      - name: Try read-only public Twitter search
        run: |
          echo '=== ACCESSCORP SEARCH ==='
          twitter search 'ACCESSCORP OR "Access Holdings" OR "Access Bank"' -n 20 || true
          echo '=== END SEARCH ==='
